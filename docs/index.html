<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dog Crush - Mobile Match-3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a0c2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; }
        #game-container { width: 100vw; height: 100vh; max-width: 540px; max-height: 960px; position: relative; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        #unity-canvas { width: 100%; height: 100%; background: #26173a; display: block; }
        #loading-cover { position: absolute; inset: 0; background: linear-gradient(135deg, #1b0a2a 0%, #3a1552 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: #fff; text-align: center; padding: 20px; }
        .logo { font-size: 36px; font-weight: 900; color: #FFD700; text-shadow: 0 4px 14px rgba(255, 215, 0, 0.5), 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 6px; letter-spacing: 1px; }
        .subtitle { font-size: 15px; color: #E0C3FC; margin-bottom: 35px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .progress-bar { width: 75%; height: 18px; background: rgba(255,255,255,0.12); border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,215,0,0.6); padding: 2px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #FF7E5F, #FEB47B, #FFD700); border-radius: 8px; transition: width 0.2s ease-out; }
        .status-text { margin-top: 18px; font-size: 14px; color: #E0C3FC; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
        <div id="loading-cover">
            <div class="logo">🐶 DOG CRUSH 🦴</div>
            <div class="subtitle">v0.4 Mobile Edition</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="status-text" id="status-text">Cargando diversión... 0%</div>
        </div>
    </div>

    <script src="Build/docs.loader.js"></script>
    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressFill = document.querySelector("#progress-fill");
        const statusText = document.querySelector("#status-text");

        const config = {
            dataUrl: "Build/docs.data.gz",
            frameworkUrl: "Build/docs.framework.js.gz",
            codeUrl: "Build/docs.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "DOGCRUSH",
            productVersion: "0.4",
        };

        createUnityInstance(canvas, config, (progress) => {
            const pct = Math.round(progress * 100);
            progressFill.style.width = pct + "%";
            statusText.textContent = "Cargando juego... " + pct + "%";
        }).then((unityInstance) => {
            loadingCover.style.display = "none";
        }).catch((message) => {
            alert("Error al cargar el juego: " + message);
        });
    </script>
</body>
</html>
